services:
  - type: web
    name: pradhan-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_NUMBER
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
