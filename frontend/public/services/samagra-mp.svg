  <path d="M 22 55 C 22 30 98 30 98 55" fill="none" stroke="#FF7A00" stroke-width="5" stroke-linecap="round"/>
  <path d="M 28 58 C 28 38 92 38 92 58" fill="none" stroke="#1565C0" stroke-width="3" stroke-linecap="round"/>

