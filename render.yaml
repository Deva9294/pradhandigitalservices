services:
  # 1. Backend API Service
  - type: web
    name: pradhan-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://pradhandigitalservices.in,https://pradhan-frontend.onrender.com,https://pradhan-frontend-4g39.onrender.com
      - key: ADMIN_REGISTRATION_SECRET
        sync: false
      - key: PDS_UPI_ID
        sync: false
      - key: ADMIN_DEFAULT_NAME
        sync: false
      - key: ADMIN_DEFAULT_EMAIL
        sync: false
      - key: ADMIN_DEFAULT_PHONE
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: AGENT_DEFAULT_NAME
        sync: false
      - key: AGENT_DEFAULT_EMAIL
        sync: false
      - key: AGENT_DEFAULT_PHONE
        sync: false
      - key: AGENT_DEFAULT_PASSWORD
        sync: false
      - key: CUSTOMER_DEFAULT_NAME
        sync: false
      - key: CUSTOMER_DEFAULT_EMAIL
        sync: false
      - key: CUSTOMER_DEFAULT_PHONE
        sync: false
      - key: CUSTOMER_DEFAULT_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false

  # 2. Frontend Next.js Web Service
  - type: web
    name: pradhan-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://pradhan-frontend-4g39.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://pradhan-backend.onrender.com/api
