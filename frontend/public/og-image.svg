<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071A3B"/>
      <stop offset="40%" stop-color="#0A2E5D"/>
      <stop offset="100%" stop-color="#0D3B76"/>
    </linearGradient>
    <linearGradient id="ogSaffron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#E06A10"/>
    </linearGradient>
    <linearGradient id="ogSaffronV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#E06A10"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D3B76"/>
      <stop offset="100%" stop-color="#113F7A"/>
    </linearGradient>
    <!-- Radial glow behind logo -->
    <radialGradient id="glow" cx="0.35" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F58220" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F58220" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  
  <!-- Subtle radial glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Background circuit/connection pattern -->
  <g opacity="0.05" stroke="white" stroke-width="1" fill="none">
    <!-- Top area -->
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="200" y1="120" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="280" y2="80"/>
    <circle cx="200" cy="120" r="3" fill="white"/>
    <circle cx="280" cy="80" r="3" fill="white"/>
    
    <!-- Right area -->
    <line x1="950" y1="200" x2="1100" y2="200"/>
    <line x1="1100" y1="200" x2="1100" y2="280"/>
    <line x1="1100" y1="280" x2="1200" y2="280"/>
    <circle cx="1100" cy="200" r="3" fill="white"/>
    
    <!-- Bottom area -->
    <line x1="100" y1="520" x2="250" y2="520"/>
    <line x1="250" y1="520" x2="250" y2="560"/>
    <line x1="250" y1="560" x2="380" y2="560"/>
    <circle cx="250" cy="520" r="3" fill="white"/>
    
    <!-- Scattered dots -->
    <circle cx="900" cy="100" r="2" fill="white"/>
    <circle cx="920" cy="100" r="2" fill="white"/>
    <circle cx="900" cy="118" r="2" fill="white"/>
    
    <circle cx="1050" cy="450" r="2" fill="white"/>
    <circle cx="1070" cy="450" r="2" fill="white"/>
    <circle cx="1050" cy="468" r="2" fill="white"/>
    <circle cx="1070" cy="468" r="2" fill="white"/>
  </g>
  
  <!-- Top saffron accent line -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#ogSaffron)"/>
  
  <!-- Bottom saffron accent line -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#ogSaffron)"/>
  
  <!-- Logo icon container -->
  <g filter="url(#shadow)" transform="translate(200, 165)">
    <rect width="120" height="120" rx="24" ry="24" fill="url(#iconBg)"/>
    
    <!-- Saffron bar on icon -->
    <rect x="18" y="10" width="84" height="5.5" rx="2.75" fill="url(#ogSaffron)"/>
    
    <!-- P letterform -->
    <path d="M31 24 L31 96" stroke="white" stroke-width="11" stroke-linecap="round"/>
    <path d="M31 24 L62 24 C82 24 90 32 90 44 C90 56 82 64 62 64 L31 64" 
          stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Center dot in P bowl -->
    <circle cx="62" cy="44" r="6" fill="url(#ogSaffronV)" opacity="0.9"/>
    <circle cx="62" cy="44" r="2.5" fill="white" opacity="0.6"/>
    
    <!-- Digital pixel grid -->
    <g fill="url(#ogSaffronV)">
      <rect x="70" y="76" width="8.5" height="8.5" rx="1.8"/>
      <rect x="82" y="76" width="8.5" height="8.5" rx="1.8"/>
      <rect x="94" y="76" width="8.5" height="8.5" rx="1.8"/>
      <rect x="70" y="88" width="8.5" height="8.5" rx="1.8"/>
      <rect x="82" y="88" width="8.5" height="8.5" rx="1.8"/>
      <rect x="94" y="88" width="8.5" height="8.5" rx="1.8" opacity="0.45"/>
      <rect x="70" y="100" width="8.5" height="8.5" rx="1.8"/>
      <rect x="82" y="100" width="8.5" height="8.5" rx="1.8" opacity="0.45"/>
      <rect x="94" y="100" width="8.5" height="8.5" rx="1.8" opacity="0.2"/>
    </g>
  </g>
  
  <!-- Brand Name -->
  <g filter="url(#textShadow)">
    <text x="360" y="225" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-0.5">
      Pradhan
    </text>
    <text x="360" y="280" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="300" fill="white" letter-spacing="1" opacity="0.9">
      Digital Services
    </text>
  </g>
  
  <!-- Decorative separator line -->
  <rect x="362" y="305" width="80" height="4" rx="2" fill="url(#ogSaffron)"/>
  
  <!-- Tagline -->
  <text x="362" y="350" font-family="'Noto Sans Devanagari', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="26" fill="white" opacity="0.75" letter-spacing="0.5">
    India's Complete Digital Seva Portal
  </text>
  
  <!-- Hindi tagline -->
  <text x="362" y="390" font-family="'Noto Sans Devanagari', 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#F58220" opacity="0.8" letter-spacing="0.3">
    भारत का संपूर्ण डिजिटल सेवा पोर्टल
  </text>
  
  <!-- Service badges at bottom -->
  <g transform="translate(200, 440)">
    <!-- Badge 1 -->
    <g>
      <rect width="150" height="42" rx="8" fill="white" opacity="0.07"/>
      <rect width="150" height="42" rx="8" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
      <text x="75" y="26" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="white" opacity="0.65" text-anchor="middle" letter-spacing="1.5" font-weight="500">
        PAN CARD
      </text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(165, 0)">
      <rect width="150" height="42" rx="8" fill="white" opacity="0.07"/>
      <rect width="150" height="42" rx="8" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
      <text x="75" y="26" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="white" opacity="0.65" text-anchor="middle" letter-spacing="1.5" font-weight="500">
        AADHAAR
      </text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(330, 0)">
      <rect width="150" height="42" rx="8" fill="white" opacity="0.07"/>
      <rect width="150" height="42" rx="8" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
      <text x="75" y="26" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="white" opacity="0.65" text-anchor="middle" letter-spacing="1.5" font-weight="500">
        PASSPORT
      </text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(495, 0)">
      <rect width="150" height="42" rx="8" fill="white" opacity="0.07"/>
      <rect width="150" height="42" rx="8" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
      <text x="75" y="26" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="white" opacity="0.65" text-anchor="middle" letter-spacing="1.5" font-weight="500">
        ITR FILING
      </text>
    </g>
  </g>
  
  <!-- URL at bottom -->
  <text x="600" y="560" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" fill="white" opacity="0.35" text-anchor="middle" letter-spacing="2" font-weight="400">
    pradhandigitalservices.com
  </text>
</svg>
