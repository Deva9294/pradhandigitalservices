name: Application Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/security-admin-route-guard-20261104]

permissions:
  contents: read

jobs:
  backend-syntax:
    name: Backend JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend JavaScript syntax
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend-build:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid/api
        run: npx tsc --noEmit
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid/api
        run: npm run build
