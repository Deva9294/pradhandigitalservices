name: Build Pradhan eSeva APK

on:
  push:
    branches: [feature/pradhan-eseva-android, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug and release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease
      - name: Verify APK contains the real app screen
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Built debug APK size: $SIZE bytes"
          test "$SIZE" -gt 100000 || { echo "APK is unexpectedly small"; exit 1; }
          CONTENTS=$(unzip -Z1 "$APK")
          echo "$CONTENTS" | grep -q '^classes.dex
      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pradhan-eSeva-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable APK to public GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_PATH" --clobber
          else
            gh release create android-latest "$APK_PATH" \
              --title "Pradhan eSeva Android App" \
              --notes "Installable debug APK for the Pradhan eSeva Android app."
          fi
 || { echo "APK has no compiled app classes"; exit 1; }
          echo "$CONTENTS" | grep -q '^AndroidManifest.xml
      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pradhan-eSeva-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable APK to public GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_PATH" --clobber
          else
            gh release create android-latest "$APK_PATH" \
              --title "Pradhan eSeva Android App" \
              --notes "Installable debug APK for the Pradhan eSeva Android app."
          fi
 || { echo "APK has no Android manifest"; exit 1; }
          echo "APK archive, compiled classes, and Android manifest verified."
      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pradhan-eSeva-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable APK to public GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_PATH" --clobber
          else
            gh release create android-latest "$APK_PATH" \
              --title "Pradhan eSeva Android App" \
              --notes "Installable debug APK for the Pradhan eSeva Android app."
          fi
